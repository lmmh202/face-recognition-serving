[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "face-recognition-serving"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    # Python 3.14 is only supported by this release candidate, which pulls in
    # keras-nightly; pinned so that builds stay reproducible.
    "tensorflow==2.22.0rc0",
    "keras-nightly==3.16.0.dev2026100904",
    "scikit-learn==1.9.1",
    "numpy==2.5.3",
    "scipy==1.18.1",
    "joblib==1.6.0",
    "pillow==12.3.0",
    "fastapi==0.162.2",
    "uvicorn==0.54.0",
    "python-multipart==0.0.33",
    "opencv-python-headless==4.14.0.94",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==9.2.0",
]

[tool.setuptools]
packages = ["app", "ml"]
